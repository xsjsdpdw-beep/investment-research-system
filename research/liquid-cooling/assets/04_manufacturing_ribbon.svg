<svg viewBox="0 0 1120 350" role="img" aria-label="冷板制造工艺流程图"><defs><linearGradient id="processFlow" x1="0" x2="1"><stop stop-color="#2e76c9"/><stop offset=".5" stop-color="#f2783f"/><stop offset="1" stop-color="#f05a67"/></linearGradient><marker id="processArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#f2783f"/></marker></defs><text x="20" y="31" class="axis">MANUFACTURING RIBBON / 冷板不是“做出来”，而是“测出来”</text><path d="M50 145H1072" stroke="#c8d6dd" stroke-width="4" marker-end="url(#processArrow)"/><circle cx="72" cy="145" r="30" fill="#f7fafb" stroke="#2e76c9" stroke-width="3"/><text x="72" y="150" text-anchor="middle" class="step-number">01</text><text x="72" y="207" text-anchor="middle" class="step-title">材料</text><text x="72" y="230" text-anchor="middle" class="node-sub">铜 / 铝 / 焊料</text><rect x="25" y="264" width="112" height="32" rx="8" fill="#eaf1f4"/><text x="81" y="285" text-anchor="middle" class="check-label">导热与兼容</text><circle cx="228" cy="145" r="30" fill="#f7fafb" stroke="#2e76c9" stroke-width="3"/><text x="228" y="150" text-anchor="middle" class="step-number">02</text><text x="228" y="207" text-anchor="middle" class="step-title">流道成型</text><text x="228" y="230" text-anchor="middle" class="node-sub">CNC / 冲压 / 蚀刻</text><rect x="181" y="264" width="112" height="32" rx="8" fill="#eaf1f4"/><text x="237" y="285" text-anchor="middle" class="check-label">尺寸与均匀性</text><circle cx="384" cy="145" r="30" fill="#f7fafb" stroke="#2e76c9" stroke-width="3"/><text x="384" y="150" text-anchor="middle" class="step-number">03</text><text x="384" y="207" text-anchor="middle" class="step-title">清洗准备</text><text x="384" y="230" text-anchor="middle" class="node-sub">洁净 / 涂钎料</text><rect x="337" y="264" width="112" height="32" rx="8" fill="#eaf1f4"/><text x="393" y="285" text-anchor="middle" class="check-label">残留与润湿</text><circle cx="540" cy="145" r="30" fill="#f7fafb" stroke="#f2783f" stroke-width="3"/><text x="540" y="150" text-anchor="middle" class="step-number">04</text><text x="540" y="207" text-anchor="middle" class="step-title">焊接成型</text><text x="540" y="230" text-anchor="middle" class="node-sub">真空钎焊 / 扩散焊</text><rect x="493" y="264" width="112" height="32" rx="8" fill="#eaf1f4"/><text x="549" y="285" text-anchor="middle" class="check-label">变形与良率</text><circle cx="696" cy="145" r="30" fill="#f7fafb" stroke="#f2783f" stroke-width="3"/><text x="696" y="150" text-anchor="middle" class="step-number">05</text><text x="696" y="207" text-anchor="middle" class="step-title">氦检</text><text x="696" y="230" text-anchor="middle" class="node-sub">零泄漏测试</text><rect x="649" y="264" width="112" height="32" rx="8" fill="#eaf1f4"/><text x="705" y="285" text-anchor="middle" class="check-label">可靠性门槛</text><circle cx="852" cy="145" r="30" fill="#f7fafb" stroke="#f2783f" stroke-width="3"/><text x="852" y="150" text-anchor="middle" class="step-number">06</text><text x="852" y="207" text-anchor="middle" class="step-title">热流测试</text><text x="852" y="230" text-anchor="middle" class="node-sub">热阻 / 流阻 / 平面度</text><rect x="805" y="264" width="112" height="32" rx="8" fill="#eaf1f4"/><text x="861" y="285" text-anchor="middle" class="check-label">平台认证</text><circle cx="1008" cy="145" r="30" fill="#f7fafb" stroke="#f05a67" stroke-width="3"/><text x="1008" y="150" text-anchor="middle" class="step-number">07</text><text x="1008" y="207" text-anchor="middle" class="step-title">量产交付</text><text x="1008" y="230" text-anchor="middle" class="node-sub">追溯 / 复检 / 维护</text><rect x="961" y="264" width="112" height="32" rx="8" fill="#eaf1f4"/><text x="1017" y="285" text-anchor="middle" class="check-label">客户回款</text><text x="20" y="332" class="note">设备与耗材：CNC / 真空钎焊炉 / 氦质谱检漏 / 点胶涂覆 / 三坐标检测。高端产能的瓶颈通常是认证良率，不是名义产能。</text></svg>